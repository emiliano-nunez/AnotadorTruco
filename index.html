<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f4d2b">
  <meta name="description" content="Anotador de puntos para el truco argentino">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Truco">
  <title>Anotador de Truco</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="fila-titulo">
      <h1>Anotador de Truco</h1>
      <button id="reiniciar" class="btn-reiniciar" aria-label="Nueva partida">↻ Nueva</button>
    </div>
    <fieldset class="limite" aria-label="Puntos de la partida">
      <legend>Partida a</legend>
      <div class="segmentos">
        <label><input type="radio" name="limite" value="15"><span>15</span></label>
        <label><input type="radio" name="limite" value="20"><span>20</span></label>
        <label><input type="radio" name="limite" value="30"><span>30</span></label>
        <label><input type="radio" name="limite" value="40"><span>40</span></label>
      </div>
    </fieldset>
  </header>

  <main class="tablero">
    <section class="equipo" data-equipo="0">
      <input class="nombre" type="text" value="Nosotros" maxlength="16" aria-label="Nombre del equipo 1">
      <div class="puntos" aria-live="polite">0</div>
      <div class="estado">Malas</div>
      <div class="fosforos"></div>
      <div class="botones">
        <button class="menos" aria-label="Restar un punto">−</button>
        <button class="mas" aria-label="Sumar un punto">+</button>
      </div>
    </section>

    <section class="equipo" data-equipo="1">
      <input class="nombre" type="text" value="Ellos" maxlength="16" aria-label="Nombre del equipo 2">
      <div class="puntos" aria-live="polite">0</div>
      <div class="estado">Malas</div>
      <div class="fosforos"></div>
      <div class="botones">
        <button class="menos" aria-label="Restar un punto">−</button>
        <button class="mas" aria-label="Sumar un punto">+</button>
      </div>
    </section>
  </main>

  <div id="confirmar" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="confirmar-titulo">
    <div class="modal-contenido">
      <svg class="icono-modal" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="#1f4d2b"/>
        <g stroke="#e9d3a0" stroke-width="5" stroke-linecap="round">
          <line x1="18" y1="18" x2="18" y2="46"/><line x1="18" y1="18" x2="46" y2="18"/>
          <line x1="46" y1="18" x2="46" y2="46"/><line x1="18" y1="46" x2="46" y2="46"/>
          <line x1="18" y1="46" x2="46" y2="18"/>
        </g>
        <g fill="#c0392b"><circle cx="18" cy="46" r="4"/><circle cx="46" cy="18" r="4"/><circle cx="46" cy="46" r="4"/></g>
      </svg>
      <h2 id="confirmar-titulo">¿Nueva partida?</h2>
      <p id="confirmar-texto" class="texto-modal">Se borran los puntos de los dos equipos.</p>
      <button id="confirmar-si">Sí, empezar de nuevo</button>
      <button id="confirmar-no" class="secundario">Cancelar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
